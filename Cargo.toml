[workspace]
members = ["freenet-migrate", "freenet-migrate-build"]
# `contracts/pointer-contract` is deliberately NOT a member. It is a frozen
# artifact whose compiled bytes must never change, and a workspace shares one
# Cargo.lock: a dependency bump in either member above could re-resolve one of
# the pointer contract's transitive dependencies, change its WASM, change its
# code hash, and re-key every pointer in the ecosystem. It carries its own
# `[workspace]`, lockfile and toolchain pin instead.
# See contracts/pointer-contract/WASM-STABILITY.md.
exclude = ["contracts/pointer-contract", "contracts/pointer-contract-conformance"]
resolver = "2"

# The two crates are independent: `freenet-migrate-build` is a *build-dependency*
# for consumers (their `build.rs`), not a runtime dependency of `freenet-migrate`.
# `freenet-migrate` depends on it only as a dev-dependency, to cross-check that
# the build-side hashing, the runtime reconstruction, and stdlib's real key
# derivation all agree.
