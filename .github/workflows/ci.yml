name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned stable toolchain: bump deliberately so clippy's lint set is stable.
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  docs:
    # `pointer`'s safety story is carried substantially by its doc comments, and
    # a link to a type a redesign deleted is how that rots. `cargo test` never
    # runs rustdoc, so this job IS the enforcement: `RUSTDOCFLAGS: -D warnings`
    # below turns a broken intra-doc link into a build failure. Deliberately not
    # a `deny` attribute in lib.rs, which downstream doc builds would inherit.
    name: rustdoc (no broken links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: wasm build (contract / delegate / ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The WASM target profiles must all compile; the `delegate` build also
      # exercises the wasm-only `DelegateCtx` SecretStore bridge.
      - name: contract feature
        run: cargo build -p freenet-migrate --no-default-features --features contract --target wasm32-unknown-unknown
      - name: delegate feature
        run: cargo build -p freenet-migrate --no-default-features --features delegate --target wasm32-unknown-unknown
      - name: ui feature
        run: cargo build -p freenet-migrate --no-default-features --features ui --target wasm32-unknown-unknown

  pointer-conformance:
    # Does the FROZEN artifact actually load and run? Everything in the job
    # below checks the contract's SOURCE -- native unit tests, an export-section
    # parse, a hash. None of it executes pointer-v1.wasm, and the artifact is
    # frozen forever, so an artifact a node cannot instantiate would be a flag
    # day to fix.
    name: pointer contract (executes in a real wasm runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/pointer-contract-conformance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/pointer-contract-conformance
      - run: cargo test --locked

  pointer-contract:
    # The pointer contract is excluded from the workspace (its bytes must not
    # move when anything else here changes), so the jobs above do not touch it.
    name: pointer contract (fmt / clippy / test / frozen wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/pointer-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Deliberately NOT ${{ env.RUST_TOOLCHAIN }}: this crate pins its own
          # toolchain in rust-toolchain.toml because rustc changes the compiled
          # bytes. Bumping the repo-wide pin must not silently re-key it.
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/pointer-contract
      - run: cargo fmt --check
      # `--locked` on every cargo invocation, not just the artifact build: an
      # earlier unlocked step runs in the same tree and would silently rewrite
      # Cargo.lock, so the frozen-hash step's own --locked would then compare
      # against the rewritten lock and pass for the wrong reason.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: lockfile is unchanged by the build
        run: git diff --exit-code Cargo.lock
      # The backstop. Rebuilds the WASM and fails if its code hash moved from
      # CODEHASH, whatever the cause -- a source edit, a dependency drift, a
      # toolchain change. See WASM-STABILITY.md.
      - name: frozen code hash
        run: ./build-wasm.sh --check
      # The committed artifact must be the one CODEHASH describes, or consumers
      # embedding the hash and users loading the .wasm would get different code.
      - name: committed artifact matches the build
        run: |
          cmp pointer-v1.wasm \
              target/wasm32-unknown-unknown/release/freenet_pointer_contract.wasm
      # Scanned by discovery over EVERY tracked text file, not just markdown:
      # a .rs, .html, .json or .toml copy of the hash goes just as stale, and
      # naming file types here reintroduces the blind spot the discovery was
      # meant to remove.
      - name: no tracked file quotes a stale code hash
        run: |
          set -euo pipefail
          EXPECTED="$(grep -v '^#' CODEHASH | tr -d '[:space:]')"
          # Comments stripped: the file is documentation as much as data, and
          # `grep -f` would otherwise treat a `#` line as a pattern.
          ALLOW="$(mktemp)"
          grep -vE '^\s*(#|$)' KNOWN-BASE58 > "$ALLOW"
          cd ../..
          # `-I` skips binaries (the .wasm and the vendored .crate tarballs).
          mapfile -t FILES < <(git ls-files)
          FOUND="$(grep -IhoE '\b[1-9A-HJ-NP-Za-km-z]{43,44}\b' "${FILES[@]}" 2>/dev/null | sort -u || true)"

          STALE="$(printf '%s\n' "$FOUND" | grep -v "^$EXPECTED$" | grep -vxFf "$ALLOW" || true)"
          if [ -n "$STALE" ]; then
            echo "Base58 values of code-hash shape that are not the pointer's current hash:"
            printf '  %s\n' $STALE
            echo
            echo "If one is a stale copy of the pointer's code hash, update it to:"
            echo "  $EXPECTED"
            echo "If it is something else entirely (another contract, a fixture),"
            echo "add it to contracts/pointer-contract/KNOWN-BASE58 with a comment"
            echo "saying what it is."
            exit 1
          fi

          # An allowlist entry that no longer appears anywhere is itself a
          # hazard: it sits there silencing a future stale hash that happens to
          # match it. Same cannot-fail shape as the guards fixed in cb78d21.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! printf '%s\n' "$FOUND" | grep -qxF "$line"; then
              echo "KNOWN-BASE58 entry is stale (appears in no tracked file): $line"
              echo "Remove it, or it will silence a real stale hash later."
              exit 1
            fi
          done < "$ALLOW"
      # The code hash is hand-copied into the docs, and consumers copy it out of
      # them. A doc that names a stale hash sends integrators to an empty
      # contract, so the copies must agree with CODEHASH.
      - name: docs quote the current code hash
        run: |
          EXPECTED="$(grep -v '^#' CODEHASH | tr -d '[:space:]')"
          for f in README.md TEST-VECTORS.md ../../FREENET.md; do
            grep -q "$EXPECTED" "$f" || { echo "$f does not quote $EXPECTED"; exit 1; }
          done
          # ...and no file may quote a DIFFERENT base58 value of the same shape,
          # except the derived keys the test vectors deliberately publish. Those
          # are listed in KNOWN-BASE58 so adding one is a visible, reviewed act
          # rather than a regex someone quietly loosens.
          if grep -rhoE '\b[1-9A-HJ-NP-Za-km-z]{43,44}\b' README.md TEST-VECTORS.md ../../FREENET.md \
             | grep -v "^$EXPECTED$" | grep -vxFf KNOWN-BASE58; then
            echo "the above look like stale code hashes; update them or add to KNOWN-BASE58"
            exit 1
          fi
