[package]
name = "freenet-migrate"
version = "0.8.0"
edition = "2021"
# u64::is_multiple_of (and CI clippy expects it) — needs 1.87+.
rust-version = "1.87"
license = "LGPL-3.0-only"
description = "Reusable contract/delegate upgrade-migration machinery for Freenet dApps"
repository = "https://github.com/freenet/freenet-migrate"
readme = "README.md"
keywords = ["freenet", "migration", "upgrade", "contract", "delegate"]
categories = ["cryptography::cryptocurrencies", "web-programming"]
# The parity test pins this crate's pointer wire format against the frozen
# contract at ../contracts/pointer-contract, which is outside this package. It
# is a repo-CI guard, so it ships nowhere: left in, `cargo test` on an unpacked
# published crate would panic on the missing files.
exclude = ["tests/pointer_contract_parity.rs"]

[features]
# Target profiles, mirroring freenet-stdlib's wasm/native split.
#
# * `contract`  — a contract WASM crate (wasm, no networking). Exposes the
#   contract carry-forward surface.
# * `delegate`  — a delegate WASM crate (wasm, no networking). Additionally
#   enables the `SecretStore` bridge over `freenet_stdlib::prelude::DelegateCtx`
#   (which is only linkable on `wasm` targets, so it is double-gated below).
# * `ui`        — native + wasm UI / release tooling. Exposes the backward-probe
#   and signing helpers.
#
# The pure carry-forward / probe / successor / delegate-handler logic is
# available in every profile; the features select dependency wiring and the
# wasm-only `DelegateCtx` bridge, not the API surface, so the whole crate is
# testable natively.
default = ["ui"]
contract = []
delegate = []
ui = []

[dependencies]
# Crate 0.8.x is the stdlib 0.12 line (crate 0.7.x is stdlib 0.8). An app
# must not hold two stdlib versions (`__frnt_set_id` is an unconditional
# `#[no_mangle]` export), so this requirement IS every adopter's stdlib, and a
# stdlib change re-keys the adopter's contracts and delegates. Never widen it
# to a range spanning lines; see CHANGELOG 0.8.0. 0.12.1 is the floor because
# it is the release current freenet-core links. Keep the dev-dependency below
# in lockstep (CI's single-stdlib check fails otherwise).
freenet-stdlib = { version = "0.12.1", default-features = false }
freenet-scaffold = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", default-features = false, features = ["macros", "alloc"] }
ciborium = "0.2.2"
blake3 = "1"
bs58 = "0.5"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The real stdlib key-derivation functions, used to generate known test vectors
# that our from-scratch reconstruction must reproduce. Kept in lockstep with the
# pinned normal dependency above.
freenet-stdlib = { version = "0.12.1", default-features = false }
# The build-side hashing, cross-checked against stdlib + our runtime reconstruction.
freenet-migrate-build = { path = "../freenet-migrate-build" }
