[package]
name = "freenet-pointer-contract"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "LGPL-3.0-only"
description = "Canonical Freenet successor-pointer contract: a stable-keyed contract whose state names the current code hash of an app's contract or delegate."
repository = "https://github.com/freenet/freenet-migrate"
readme = "README.md"
# Not published to crates.io. The artifact that matters is the compiled WASM
# (see WASM-STABILITY.md); publishing a source crate would invite consumers to
# rebuild it locally, which is exactly what must not happen.
publish = false

# DELIBERATELY ITS OWN WORKSPACE -- do not add this crate to the repository
# workspace's `members`.
#
# A workspace shares one Cargo.lock. If this crate were a member, a dependency
# bump anywhere else in freenet-migrate could re-resolve a transitive dependency
# of *this* crate, changing the compiled WASM, changing this contract's code
# hash, and re-keying every pointer in the ecosystem. Isolation is the whole
# point. See WASM-STABILITY.md.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Emits the four `#[no_mangle]` entry points the node calls, and pulls in
# stdlib's WASM memory interface that they are implemented over.
#
# OFF BY DEFAULT, and that is deliberate. The `#[contract]` macro's exports
# carry no target gate, so a native consumer that depends on this crate to get
# `PointerParams` / `PointerRecord` would otherwise link four `#[no_mangle]`
# symbols into its own binary -- and collide at link time with any other
# contract crate in its graph. Consumers take `default-features = false`;
# `build-wasm.sh` turns this on explicitly for the artifact build, and its
# export check fails loudly if it is ever missing.
#
# These two must move together. The `#[contract]` macro gates its exports on
# *this crate's* `freenet-main-contract` feature, while the memory interface
# those exports call lives behind *stdlib's* `contract` feature. Enabling one
# without the other silently produces a WASM with no exports at all -- a
# 149-byte file that a node loads and that does nothing. `build-wasm.sh`
# re-checks the exports are present for exactly this reason.
freenet-main-contract = ["freenet-stdlib/contract"]
# Publisher-side signing helpers. NOT enabled for the canonical WASM build --
# a node only ever verifies, never signs, so this keeps signing code out of the
# frozen artifact.
#
# `dep:bs58` rides along here rather than in the unconditional dependency list
# for the same reason. Publishers and CI gates deal in the base58 forms that
# actually appear in an app's FREENET.md (`CODEHASH`, an author verifying key,
# a contract key); the contract itself never parses one, because its params
# carry raw bytes. bs58 0.5.1 is ALREADY in this crate's lockfile transitively
# via freenet-stdlib, at the identical version pinned here, so naming it
# directly resolves to the same package and adds nothing to the graph. The
# frozen-WASM check in CI (`./build-wasm.sh --check`) is what proves that
# claim rather than merely asserting it.
# `ed25519-dalek/zeroize` activates that crate's zeroizing `Drop` for
# `SigningKey`, which is compiled OUT by default: the base dependency takes only
# `features = ["alloc"]`, so today nothing scrubs a production signing key from
# memory after use. Enabled HERE rather than on the dependency line so it stays
# off for the wasm32 build and cannot touch the frozen artifact.
publish = ["dep:bs58", "dep:zeroize", "ed25519-dalek/zeroize"]

[dependencies]
# EXACT pins ("=", not "^"). A caret range lets a fresh resolve on a machine
# without the lockfile, or a `cargo update`, pick a newer semver-compatible
# release and silently change the compiled bytes. Bumping either of these is a
# flag day (WASM-STABILITY.md), not routine maintenance.
#
# freenet-stdlib 0.8.5: the current release at freeze time. `default-features`
# is empty upstream; we take nothing beyond the contract interface and the
# `#[contract]` FFI glue.
freenet-stdlib = { version = "=0.8.5", default-features = false }
# ed25519-dalek 2.1.1, `alloc` only: no `rand_core`, so no `getrandom`, so no
# wasm-bindgen contamination in the WASM build. Verification never needs an RNG.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["alloc"] }
# Optional, and reached only through the `publish` feature -- see the note there.
# Pinned exactly, like everything else here: this crate's whole premise is that a
# fresh resolve on a machine without the lockfile cannot change its bytes.
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"], optional = true }
# Same gating, same reason. Used to scrub the key file's text and every
# intermediate copy of the secret on the way to `SigningKey`.
#
# PINNED TO THE VERSION ALREADY IN THE LOCKFILE, and that is load-bearing.
# zeroize is ALREADY a transitive dependency here via curve25519-dalek, which
# IS compiled into the frozen WASM. A first attempt pinned `=1.8.2`, which
# DOWNGRADED the existing 1.9.0 resolution and changed the artifact's bytes --
# `build-wasm.sh --check` caught it. Naming a version here that differs from
# what is already resolved is a flag day, not a dependency addition.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
# Test keys are derived from fixed byte arrays, never generated, so the test
# suite needs no RNG either -- one less dependency that can drift.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Gated on `publish` so the canonical WASM build (default features only) never
# tries to compile a host binary for the wasm32 target.
[[bin]]
name = "pointer-codehash"
path = "src/bin/pointer-codehash.rs"
required-features = ["publish"]

# The publisher-side and CI-gate tool. Same gating rationale as the bin above:
# it is a host binary, so the wasm32 build must never try to compile it.
[[bin]]
name = "pointer-record"
path = "src/bin/pointer-record.rs"
required-features = ["publish"]
