name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned stable toolchain: bump deliberately so clippy's lint set is stable.
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  wasm:
    name: wasm build (contract / delegate / ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The WASM target profiles must all compile; the `delegate` build also
      # exercises the wasm-only `DelegateCtx` SecretStore bridge.
      - name: contract feature
        run: cargo build -p freenet-migrate --no-default-features --features contract --target wasm32-unknown-unknown
      - name: delegate feature
        run: cargo build -p freenet-migrate --no-default-features --features delegate --target wasm32-unknown-unknown
      - name: ui feature
        run: cargo build -p freenet-migrate --no-default-features --features ui --target wasm32-unknown-unknown

  pointer-contract:
    # The pointer contract is excluded from the workspace (its bytes must not
    # move when anything else here changes), so the jobs above do not touch it.
    name: pointer contract (fmt / clippy / test / frozen wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/pointer-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Deliberately NOT ${{ env.RUST_TOOLCHAIN }}: this crate pins its own
          # toolchain in rust-toolchain.toml because rustc changes the compiled
          # bytes. Bumping the repo-wide pin must not silently re-key it.
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/pointer-contract
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      # The backstop. Rebuilds the WASM and fails if its code hash moved from
      # CODEHASH, whatever the cause -- a source edit, a dependency drift, a
      # toolchain change. See WASM-STABILITY.md.
      - name: frozen code hash
        run: ./build-wasm.sh --check
      # The committed artifact must be the one CODEHASH describes, or consumers
      # embedding the hash and users loading the .wasm would get different code.
      - name: committed artifact matches the build
        run: |
          cmp pointer-v1.wasm \
              target/wasm32-unknown-unknown/release/freenet_pointer_contract.wasm
